[package]
name = "rredis-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
num-bigint = "0.4.6"
rustyline = { version = "14.0", features = ["with-file-history"] }
ratatui = "0.26.0"
crossterm = "0.27.0"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
